[package]
name = "fl-studio-manager"
version = "0.6.2"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "fl_studio_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
# In-app updates: the signed manifest and installers live in the public
# `releases` bucket of the crew's Supabase project (see tauri.conf.json).
tauri-plugin-updater = { version = "2", default-features = false, features = ["rustls-tls", "system-proxy"] }
tauri-plugin-process = "2"
walkdir = "2.5.0"
trash = "5"
zip = { version = "9", default-features = false, features = ["deflate"] }
# Mixdowns (wav, mp3, ogg, flac) and what phones export (BandLab's M4A: AAC or
# ALAC in MP4; AIFF). Kept to these: less decoder surface for files that
# come from crewmates (a decoder panic is caught per file, audio.rs).
symphonia = { version = "0.5", default-features = false, features = ["wav", "pcm", "adpcm", "mp3", "ogg", "vorbis", "flac", "aiff", "isomp4", "aac", "alac"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
tokio = { version = "1.53.2", features = ["time"] }
base64 = "0.23"
rustfft = "6"
flate2 = "1"
quick-xml = "0.42"
tiny_http = "0.12"
chacha20poly1305 = "0.11"
# Phone pairing v1.2 (docs/PHONE-SYNC.md): X25519 + HKDF-SHA256 derive the
# device key, so the QR only carries a one-time token.
x25519-dalek = { version = "3", features = ["static_secrets"] }
hkdf = "0.13"
sha2 = "0.11"
if-addrs = "0.15"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
# GetDriveTypeW: backups on removable/network drives skip the Recycle Bin.
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[target.'cfg(target_os = "macos")'.dependencies]
# statfs: network volumes have no Trash.
libc = "0.2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
# Unwind, not abort: a panic while reading one damaged or hostile project or
# mixdown is caught (scanner.rs, audio.rs) instead of closing the app.
panic = "unwind"
strip = true
